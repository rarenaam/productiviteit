<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer - ProductiviteitHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="512x512" href="../ProductiviteitHub.png">
    <link rel="apple-touch-icon" href="../ProductiviteitHub.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://www.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
</head>
<body class="timer-page">

    <nav>
        <div class="nav-container">
            <a href="../index.html" class="logo">Productiviteit<span>Hub</span></a>
            <div class="menu">
                <a href="../index.html">Home</a>
                <a href="../notitie/index.html">Notities</a>
                <a href="../agenda/index.html">Agenda</a>
                <a href="index.html" class="active">Hulpmiddel Leren</a>
            </div>
            <div class="user-controls">
                <span id="userNameDisplay">Laden...</span>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="timer-section">
            <h1 id="timer-status">Pomodoro Focus</h1>
            <p class="subtitle">Voer je totale tijd in en wij verdelen het over ideale sessies.</p>

            <div class="timer-circle" id="countdown">00:00</div>

            <div class="setup-area">
                <div class="input-field">
                    <label for="totalMinutes">Beschikbare tijd (minuten):</label>
                    <input type="number" id="totalMinutes" placeholder="Bijv. 70" min="1">
                </div>
            </div>

            <div class="timer-controls">
                <button id="startStudy" class="btn-timer btn-start">Start Planning</button>
                <button id="resetTimer" class="btn-timer btn-reset">Reset</button>
            </div>

            <div class="stats-card">
                <h3>Totaal voltooid</h3>
                <p><span id="sessionCount">0</span> Pomodoro sessies</p>
                <small>Elke voltooide sessie wordt opgeslagen op je dashboard.</small>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
