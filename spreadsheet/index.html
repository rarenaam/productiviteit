<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hulpmiddel Leren - Pomodoro</title>
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://www.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">

    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="../index.html" class="logo">Productiviteit<span>Hub</span></a>
            <div class="menu" id="navMenu">
                <a href="../index.html">Home</a>
                <a href="../notitie/index.html">Notities</a>
                <a href="../agenda/index.html">Agenda</a>
                <a href="index.html" class="active">Hulpmiddel Leren</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="timer-container">
            <h1>Pomodoro Focus</h1>
            <p>Concentreer je op je werk. We houden je voortgang bij.</p>

            <div class="timer-circle" id="timerDisplay">25:00</div>

            <div class="timer-controls">
                <button id="startBtn" class="btn-start">Start Focus</button>
                <button id="resetBtn" class="btn-reset">Reset</button>
            </div>

            <div class="stats-card">
                <h3>Vandaag voltooid</h3>
                <p><span id="sessionCount">0</span> Pomodoro sessies</p>
                <small>Elke sessie staat voor 25 minuten diepe focus.</small>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
