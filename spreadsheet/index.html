<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hulpmiddel Leren - Pomodoro</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://www.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">

    <link rel="stylesheet" href="../style.css">
    <style>
        /* Specifieke stijlen voor de Timer */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            text-align: center;
        }

        .timer-circle {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 8px solid #1e293b;
            border-top: 8px solid #3b82f6; /* Blauwe accentkleur */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .timer-controls button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            margin: 0 10px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-start { background-color: #3b82f6; color: white; }
        .btn-reset { background-color: #ef4444; color: white; }
        
        .stats-card {
            margin-top: 3rem;
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="../index.html" class="logo">Productiviteit<span>Hub</span></a>
            <div class="menu" id="navMenu">
                <a href="../index.html">Home</a>
                <a href="../notitie/index.html">Notities</a>
                <a href="../agenda/index.html">Agenda</a>
                <a href="index.html" class="active">Hulpmiddel Leren</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="timer-container">
            <h1>Pomodoro Focus</h1>
            <p>Concentreer je op je werk. We houden je voortgang bij.</p>

            <div class="timer-circle" id="timerDisplay">25:00</div>

            <div class="timer-controls">
                <button id="startBtn" class="btn-start">Start Focus</button>
                <button id="resetBtn" class="btn-reset">Reset</button>
            </div>

            <div class="stats-card">
                <h3>Vandaag voltooid</h3>
                <p><span id="sessionCount">0</span> Pomodoro sessies</p>
                <small>Elke sessie staat voor 25 minuten diepe focus.</small>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
