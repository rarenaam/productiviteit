<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="sidebar">
      <h1>Notes</h1>
      <button id="addNoteBtn">New Note</button>
      <ul id="notesList"></ul>
    </div>
    <div class="main">
      <input id="noteTitle" placeholder="Title" />
      <textarea id="noteContent" placeholder="Start writing your note..."></textarea>
      <button id="deleteNoteBtn">Delete Note</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
