<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Agenda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="burger">☰</button>
  <h1 id="weekLabel">Agenda</h1>
  <div></div>
</header>

<div id="menu" class="menu hidden">
  <button data-view="agenda">Agenda</button>
  <button data-view="notes">Notities</button>
</div>

<!-- AGENDA -->
<div id="agenda-view">
  <div class="agenda-wrapper">
    <table>
      <thead>
        <tr id="daysRow"></tr>
      </thead>
      <tbody id="agendaBody"></tbody>
    </table>
  </div>
</div>

<!-- NOTITIES -->
<div id="notes-view" hidden>
  <div class="notes-wrapper">
    <textarea id="notes" placeholder="Schrijf hier je notities..."></textarea>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
