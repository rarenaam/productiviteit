<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - ProductiviteitHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="512x512" href="../ProductiviteitHub.png">
    <link rel="apple-touch-icon" href="../ProductiviteitHub.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="../index.html" class="logo">Productiviteit<span>Hub</span></a>
            <div class="menu">
                <a href="../index.html">Home</a>
                <a href="../notitie/index.html">Notities</a>
                <a href="index.html" class="active">Agenda</a>
                <a href="../hulpmiddel/index.html">Hulpmiddel Leren</a>
            </div>
            <div class="user-controls">
                <span id="userNameDisplay">Laden...</span>
            </div>
        </div>
    </nav>

    <div class="agenda-wrapper">
        <header class="agenda-header">
            <button id="prev">◀ Vorige</button>
            <h2 id="weekLabel">Maand Jaar</h2>
            <button id="next">Volgende ▶</button>
        </header>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr id="daysRow">
                        <th class="time-col">Tijd</th>
                        </tr>
                </thead>
                <tbody id="agendaBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
