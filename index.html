<!DOCTYPE html>
<html>
	<head>
		<title>Productiviteit</title>
		<meta charset="UTF-8">
		<style>
			body {
				background-color: #4a4a4a;
				font-family: 'Arial', sans-serif;
			}

			h1 {
				color: white;
				font-size: clamp(5px, 1vw + 3.5vh, 64px);
				top: 8%;
				position: fixed;
			}

			p {
				color: white;
				font-size: 30px;
			}

			li {
				color: white;
				font-size: 24px;
				text-shadow: 8px 8px 12px black;
			}

	.button {
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #007FFF;
			color: white;
			border-radius: 5px;
			font-size: clamp(1px, 1vw + 1vh, 48px);
			text-align: center;
			transition: background-color 0.3s ease, color 0.3s ease;
			border:1px solid #007FFF;
			height: 6%;
			}
			
			.button:hover {
				background-color: white;
				color: #007FFF;
				
			}

			.rechthoek {
				width: 100%;
				height: 8%;
				top: 0%;
				left: 0;
				background-color: white;
				position: fixed;
				z-index: 1;
			}

			#buttonHome {
				position: fixed;
				top: 1%;
				left: 2%;
				margin-right: calc(4% + 50px);
				z-index: 2;
				width: calc(9% + 50px);
				
			}

			#buttonAgenda {
				position: fixed;
				top: 1%;
				margin-right: calc(5% + 50px);
				z-index: 2;
				width: calc(11% + 50px);
				left: calc(12% + 50px);
			}

			#buttonNotitie {
				position: fixed;
				top: 1%;
				margin-right: calc(3% + 50px);
				z-index: 2;
				width: calc(9% + 50px);
				left: calc(24% + 100px);
			}

			#buttonSpreadsheet {
				position: fixed;
				top: 1%;
				margin-right: calc(4% + 150px);
				z-index: 2;
				width: calc(15% + 50px);
				left: calc(34% + 150px);
			}

		</style>	
	</head>
	<body>
		<h1>Wat wil je doen?</h1>

			<a href="index.html" class="button" id="buttonHome">home</a>
			<a href="agenda/index.html" class="button" id="buttonAgenda">agenda</a>
			<a href="notitie/index.html" class="button" id="buttonNotitie">notitie</a>
			<a href="spreadsheet.html" class="button" id="buttonSpreadsheet">spreadsheet</a>

		

		<div class="rechthoek"></div>

	</body>
</html>
