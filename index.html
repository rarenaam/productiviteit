<!DOCTYPE html>
<html>
<head>
    <title>Productiviteit</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Wat wil je doen?</h1>

    <a href="index.html" class="button" id="buttonHome">home</a>
    <a href="/productiviteit/agenda/" class="button" id="buttonAgenda">agenda</a>
    <a href="/productiviteit/notitie/" class="button" id="buttonNotitie">notitie</a>
    <a href="/productiviteit/spreadsheet/" class="button" id="buttonSpreadsheet">spreadsheet</a>

    <div class="rechthoek"></div>

    <div id="auth-container">
        <h2>Aanmelden</h2>
        <form id="loginForm">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required><br><br>
            <label for="password">Wachtwoord:</label>
            <input type="password" id="password" required><br><br>
            <button type="submit">Aanmelden</button>
            <p id="authError" style="color: red;"></p>
        </form>
    </div>

    <!-- Firebase Initialisatie Code -->
    <script type="module">
      // Importeer de functies die je nodig hebt van de SDK's
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; // signInWithEmailAndPassword toegevoegd!
      import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      // Jouw web-app's Firebase configuratie
      const firebaseConfig = {
        apiKey: "AIzaSyDxCYAfIidmglAcgAbfgSPOtZ2HRHDHo7Q",
        authDomain: "productivitiet2.firebaseapp.com",
        projectId: "productivitiet2",
        storageBucket: "productivitiet2.firebasestorage.app",
        messagingSenderId: "492077829856",
        appId: "1:492077829856:web:7ca946d2d325ecfc724a85",
        measurementId: "G-EFCMG6X53K"
      };

      // Initialiseer Firebase
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app); // Initialiseer Analytics als je dat wilt gebruiken

      // Initialiseer Authentication en Firestore services
      const auth = getAuth(app);     // Dit is je Authentication object
      const db = getFirestore(app); // Dit is je Firestore object

      console.log("Firebase is geïnitialiseerd!");
      console.log("Auth object:", auth);
      console.log("Firestore object:", db);

      // ----- Start van de nieuwe code voor aanmelden -----

      // Functie om een gebruiker aan te melden met e-mail en wachtwoord
      async function signInUser(email, password) {
        const authErrorElement = document.getElementById('authError');
        authErrorElement.textContent = ''; // Maak eventuele eerdere foutmeldingen leeg

        try {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          // Gebruiker succesvol aangemeld
          const user = userCredential.user;
          console.log("Gebruiker is aangemeld:", user);
          alert("Succesvol aangemeld!"); // Simpele melding aan de gebruiker
          // Hier kun je de gebruiker doorverwijzen of de UI bijwerken
        } catch (error) {
          // Er is een fout opgetreden tijdens het aanmelden
          const errorCode = error.code;
          const errorMessage = error.message;
          console.error("Fout bij aanmelden:", errorCode, errorMessage);
          // Toon een specifieke foutmelding aan de gebruiker
          switch (errorCode) {
            case 'auth/user-not-found':
              authErrorElement.textContent = 'Geen gebruiker gevonden met dit e-mailadres.';
              break;
            case 'auth/wrong-password':
              authErrorElement.textContent = 'Het ingevoerde wachtwoord is onjuist.';
              break;
            case 'auth/invalid-email':
              authErrorElement.textContent = 'Het e-mailadres is ongeldig.';
              break;
            default:
              authErrorElement.textContent = `Fout bij aanmelden: ${errorMessage}`;
          }
        }
      }

      // Luister naar het indienen van het formulier
      document.addEventListener('DOMContentLoaded', () => {
          const loginForm = document.getElementById('loginForm');
          if (loginForm) {
              loginForm.addEventListener('submit', (e) => {
                  e.preventDefault(); // Voorkom dat de pagina opnieuw laadt bij het indienen van het formulier

                  const emailInput = document.getElementById('email');
                  const passwordInput = document.getElementById('password');

                  const email = emailInput.value;
                  const password = passwordInput.value;

                  if (email && password) {
                      signInUser(email, password);
                  } else {
                      document.getElementById('authError').textContent = 'Vul alstublieft zowel e-mail als wachtwoord in.';
                  }
              });
          }
      });
      // ----- Einde van de nieuwe code voor aanmelden -----

    </script>
</body>
</html>
