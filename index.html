<!DOCTYPE html>
<html>
<head>
    <title>Productiviteit</title>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com;">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen">
        <p>Laden...</p>
    </div>

    <div id="auth-container">
        <div id="login-section">
            <h2>Aanmelden</h2>
            <form id="loginForm">
                <label for="loginEmail">E-mail:</label>
                <input type="email" id="loginEmail" required><br><br>
                
                <label for="loginPassword">Wachtwoord:</label>
                <input type="password" id="loginPassword" required><br><br>
                
                <button type="submit">Aanmelden</button>
                <p id="authErrorLogin" class="auth-error-message"></p>
            </form>
            <p class="auth-toggle">Nog geen account? <a href="#" id="showRegister">Registreer hier</a></p>
        </div>

        <div id="register-section" style="display:none;">
            <h2>Registreren</h2>
            <form id="registerForm">
                <label for="registerDisplayName">Weergavenaam (optioneel):</label>
                <input type="text" id="registerDisplayName"><br><br>
                
                <label for="registerEmail">E-mail:</label>
                <input type="email" id="registerEmail" required><br><br>
                
                <label for="registerPassword">Wachtwoord:</label>
                <input type="password" id="registerPassword" required><br><br>
                
                <label for="registerPasswordConfirm">Bevestig Wachtwoord:</label>
                <input type="password" id="registerPasswordConfirm" required><br><br>
                
                <button type="submit">Account aanmaken</button>
                <p id="authErrorRegister" class="auth-error-message"></p>
            </form>
            <p class="auth-toggle">Al een account? <a href="#" id="showLogin">Meld je hier aan</a></p>
        </div>
    </div>

    <div id="app-content">
        <div class="rechthoek">
            <a href="index.html" class="button" id="buttonHome">home</a>
            <a href="/productiviteit/agenda/" class="button" id="buttonAgenda">agenda</a>
            <a href="/productiviteit/notitie/" class="button" id="buttonNotitie">notitie</a>
            <a href="/productiviteit/spreadsheet/" class="button" id="buttonSpreadsheet">spreadsheet</a>
            
            <span id="userName"></span>
            <button id="signOutButton">Afmelden</button>
        </div>

        <div id="main-app-area">
            <h2>Welkom, <span id="userName-content"></span>!</h2>
            <p>Dit is je persoonlijke content. Je bent aangemeld.</p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
