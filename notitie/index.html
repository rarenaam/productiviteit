<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Notes App</title>
  <!-- CSS pad vanuit html/ naar css/ -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Hamburger button -->
  <button id="hamburgerBtn" class="hamburger">☰</button>

  <!-- Navigatie menu -->
  <nav id="navMenu" class="nav hidden">
    <a href="../../index.html">Home</a>
    <a href="../agenda/html/index.html">Calendar</a>
    <a href="index.html">Notes</a>
    <a href="../spreadsheet/html/index.html">Spreadsheet</a>
  </nav>

  <div class="container">
    <div class="sidebar">
      <h1>Notes</h1>
      <button id="addNoteBtn">New Note</button>
      <ul id="notesList"></ul>
    </div>
    <div class="main">
      <input id="noteTitle" placeholder="Title" />
      <textarea id="noteContent" placeholder="Start writing your note..."></textarea>
      <button id="deleteNoteBtn">Delete Note</button>
    </div>
  </div>

  <!-- JS pad vanuit html/ naar js/ -->
  <script src="../js/script.js"></script>
</body>
</html>
