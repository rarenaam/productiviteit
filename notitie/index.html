<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://www.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">

<body>

  <button id="hamburgerBtn">☰</button>

  <nav id="navMenu" class="nav">

    <a href="../agenda/">Calendar</a>

  <div class="container">
    <div class="sidebar">
      <h1>Notities</h1>
      <button id="addNoteBtn" disabled>Nieuwe Notitie</button>
      <ul id="notesList"></ul>

    <div class="main">
      <input id="noteTitle" placeholder="Titel" disabled />

      <button id="deleteNoteBtn" disabled>Verwijder Notitie</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
